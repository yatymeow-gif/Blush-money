<!doctype html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF1F2">
<meta name="description" content="Private, offline personal finance planner. Your data stays on your device.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Blush Money">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Blush Money</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#FBF1F2; --bg2:#F5E3E7; --card:#FFFFFF; --cream:#FFF8F1; --ink:#3B2C31; --ink2:#857078; --ink3:#B6A3A9; --line:#F0DFE3;
  --rose:#C27C8E; --rose-d:#A35F73; --rose-l:#F6DEE4; --rose-xl:#FCEEF1;
  --lilac:#ECE5F6; --lilac-d:#8E7BB5; --sage:#4F8A66; --sage-l:#E3EFE6; --coral:#D0685A; --coral-l:#FBE4DF; --amber:#C8922E; --amber-l:#FBF0DA;
  --shadow:0 2px 10px rgba(163,95,115,.08); --shadow2:0 10px 30px rgba(120,60,80,.18);
  --r:20px; --r-s:14px; --nav-h:74px;
  --font: ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#1D1618; --bg2:#271D21; --card:#2A2025; --cream:#30252A; --ink:#F6E9ED; --ink2:#C0A9B1; --ink3:#86717A; --line:#3A2D33;
  --rose:#D995A7; --rose-d:#E6AABA; --rose-l:#4A3039; --rose-xl:#33252B; --lilac:#3A3148; --lilac-d:#B8A6DF; --sage:#86C19C; --sage-l:#243A2D; --coral:#EE8A7C; --coral-l:#46282A; --amber:#E2B45A; --amber-l:#3D321F;
  --shadow:0 2px 10px rgba(0,0,0,.3); --shadow2:0 10px 30px rgba(0,0,0,.5); color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--rose-d)}
#app{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom));min-height:100vh}
.screen{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header */
.top{display:flex;align-items:center;gap:6px;margin:6px 0 14px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:0;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top>div{min-width:0}
.top .sub{font-size:13px;color:var(--ink2);font-weight:600}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);flex:none;position:relative;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.iconbtn .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--coral);border:2px solid var(--card)}
.iconbtn.sm{width:34px;height:34px}.iconbtn.sm svg{width:16px;height:16px}

/* segmented */
.seg{display:flex;background:var(--bg2);border-radius:16px;padding:4px;gap:2px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:transparent;padding:10px 8px;border-radius:12px;font-weight:700;color:var(--ink2);font-size:14px;white-space:nowrap;transition:background .2s,color .2s;min-width:fit-content}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg.sm button{padding:8px 6px;font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--rose);color:#fff;border-color:var(--rose)}
:root[data-theme="dark"] .chip.on{color:#1D1618}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--line)}
.card.tint{background:var(--rose-xl)}
.card.lilac{background:var(--lilac)}.card.sage{background:var(--sage-l)}.card.coral{background:var(--coral-l)}.card.cream{background:var(--cream)}
.card h3{margin:0 0 10px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font-size:13px;font-weight:700;color:var(--rose-d);background:none;border:0;padding:0}
.hero{background:linear-gradient(135deg,#E8A8B8 0%,#C98A9C 55%,#B48FC4 100%);color:#fff;border:0}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#6E3F50,#4E3560)}
.hero .lbl{opacity:.9;font-size:13px;font-weight:700}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:2px 0 10px}
.hero .grid2 .v{color:#fff}
.lbl{font-size:12px;font-weight:700;color:var(--ink2);text-transform:none}
.big{font-size:26px;font-weight:800;letter-spacing:-.3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 .stat{padding:9px 8px}.grid3 .stat .v{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.grid2 .stat .v,.grid2 .big{overflow-wrap:anywhere}
.stat{background:rgba(255,255,255,.18);border-radius:14px;padding:10px}
.card .stat{background:var(--rose-xl)}
.hero .stat{background:rgba(255,255,255,.18)}
.stat .v{font-weight:800;font-size:17px}
.stat .l{font-size:12px;font-weight:700;opacity:.85}
.muted{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:12px}.b{font-weight:800}.center{text-align:center}
.pos{color:var(--sage)!important}.neg{color:var(--coral)!important}.warn{color:var(--amber)!important}
.row-flex{display:flex;align-items:center;gap:10px}.spacer{flex:1}
.mt{margin-top:12px}.mb{margin-bottom:12px}.mt0{margin-top:0}

/* list rows */
.list{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:12px}
.list.tint{background:var(--rose-xl)}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;color:var(--ink)}
.item:last-child{border-bottom:0}
button.item:active,.item.click:active{background:var(--rose-xl)}
.item .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none;background:var(--rose-xl)}
.item .mid{flex:1;min-width:0}
.item .t1{font-weight:750;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{text-align:right;flex:none}
.item .amt-v{font-weight:800;font-size:15.5px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:14px 4px 6px;font-weight:800}
.dayhead span:last-child{font-weight:600;color:var(--ink2);font-size:13px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--bg2);color:var(--ink2);white-space:nowrap}
.badge.overdue,.badge.partial-overdue,.badge.unpaid{background:var(--coral-l);color:var(--coral)}
.badge.due{background:var(--amber-l);color:var(--amber)}
.badge.paid{background:var(--sage-l);color:var(--sage)}
.badge.partial{background:var(--lilac);color:var(--lilac-d)}
.badge.deferred{background:var(--lilac);color:var(--lilac-d)}
.badge.est{background:var(--cream);color:var(--amber)}
.badge.sample{background:var(--lilac);color:var(--lilac-d)}

/* buttons */
.btn{border:0;border-radius:16px;padding:13px 18px;font-weight:800;background:var(--rose);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;transition:transform .1s,filter .2s}
:root[data-theme="dark"] .btn{color:#1D1618}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:var(--card);color:var(--rose-d);border:1px solid var(--line)}
.btn.soft{background:var(--rose-l);color:var(--rose-d)}
.btn.danger{background:var(--coral);color:#fff}
.btn.sage{background:var(--sage);color:#fff}
.btn.sm{padding:8px 12px;border-radius:12px;font-size:13px}
.btn svg{width:18px;height:18px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--sage);font-weight:800;border-radius:12px;padding:7px 12px;font-size:13px;white-space:nowrap}
.pill.rose{color:var(--rose-d)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>.btn{flex:1}
.linkbtn{background:none;border:0;color:var(--rose-d);font-weight:800;padding:4px 0;font-size:14px}

/* progress */
.bar{height:9px;border-radius:9px;background:var(--bg2);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--rose);transition:width .5s ease}
.bar.sage>i{background:var(--sage)}.bar.lilac>i{background:var(--lilac-d)}.bar.over>i{background:var(--coral)}.bar.warn>i{background:var(--amber)}

/* month nav */
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.monthnav .t{font-weight:800;font-size:17px;border:0;background:none}
.inout{text-align:center;font-weight:700;color:var(--ink2);margin-bottom:10px;font-size:15px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:620px;margin:0 auto;display:flex;height:var(--nav-h);align-items:center}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink3);padding:8px 0}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--rose-d)}
.nav .fab{flex:none;width:64px;height:64px;border-radius:50%;background:var(--rose);color:#fff;margin:-34px 10px 0;box-shadow:var(--shadow2);display:grid;place-items:center;border:4px solid var(--bg)}
.nav .fab svg{width:30px;height:30px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(59,44,49,.38);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:ofade .2s ease}
@keyframes ofade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--ink3);opacity:.5;margin:4px auto 10px}
.sheet .sh{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:-8px;background:var(--bg);padding:6px 0;z-index:2}
.sheet .sh h2{margin:0;font-size:21px;font-weight:800;flex:1}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:26px;max-height:88vh}}

/* forms */
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;font-weight:800;color:var(--ink2);margin:0 0 5px 4px}
.f .hint{font-size:12px;color:var(--ink2);margin:4px 4px 0}
.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:16px;outline:none;transition:border .2s;appearance:none;-webkit-appearance:none}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.inp:focus{border-color:var(--rose)}
textarea.inp{min-height:80px;resize:vertical}
.amount-inp{font-size:34px;font-weight:800;text-align:center;border:0;background:transparent;width:100%;outline:none;padding:6px 0;color:var(--ink)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:10px;padding:10px 4px;font-weight:700;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--rose)}
.typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.typegrid button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 4px;font-weight:800;font-size:13px;color:var(--ink2)}
.typegrid button.on{border-color:var(--rose);color:var(--rose-d);background:var(--rose-xl)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.catgrid button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 2px;font-size:11.5px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.catgrid button span{font-size:22px}
.catgrid button.on{border-color:var(--rose);background:var(--rose-xl);color:var(--ink)}
.subchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.subchips .chip{padding:6px 11px;font-size:13px}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.quick button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 11px;font-size:13px;font-weight:700}
.emojipick{display:flex;flex-wrap:wrap;gap:6px}
.emojipick button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:20px}
.emojipick button.on{border-color:var(--rose);background:var(--rose-xl)}
.colorpick{display:flex;flex-wrap:wrap;gap:8px}
.colorpick button{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.colorpick button.on{box-shadow:0 0 0 3px var(--ink)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;font-weight:800;color:var(--ink3);text-align:center;padding:4px 0}
.cal button{aspect-ratio:1/1.05;border:0;border-radius:12px;background:var(--card);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:3px;color:var(--ink);border:1px solid var(--line)}
.cal button.out{opacity:.35}
.cal button.today{border:2px solid var(--rose)}
.cal button.sel{background:var(--rose);color:#fff}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:90%}
.cal .dots i{width:6px;height:6px;border-radius:50%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);margin:8px 2px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--ink2);font-weight:800;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tblwrap{overflow-x:auto}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px;gap:10px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:800}
.kv.total{font-size:16px;border-top:2px solid var(--line);border-bottom:0;margin-top:4px;padding-top:10px}

/* charts */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink2);font-size:10px;font-family:var(--font);font-weight:700}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart rect.b,.chart path.sl,.chart circle.pt{cursor:pointer}
.chart rect.b:hover,.chart path.sl:hover{opacity:.8}
.donutwrap{display:flex;gap:14px;align-items:center}
.donutwrap .chart{width:44%;flex:none}
.leg{flex:1;min-width:0}
.leg div{display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 0}
.leg div i{width:10px;height:10px;border-radius:4px;flex:none}
.leg div span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip{position:fixed;z-index:90;background:var(--ink);color:var(--bg);padding:7px 11px;border-radius:10px;font-size:13px;font-weight:700;pointer-events:none;transform:translate(-50%,-120%);white-space:nowrap}

/* misc */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:100;box-shadow:var(--shadow2);animation:up .25s ease;max-width:90vw;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:var(--rose-l);font-weight:800}
.empty{text-align:center;color:var(--ink2);padding:26px 12px;font-size:14.5px}
.empty .e{font-size:38px;margin-bottom:6px}
.banner{border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--amber-l);color:var(--ink)}.banner.err{background:var(--coral-l);color:var(--ink)}.banner.info{background:var(--lilac);color:var(--ink)}.banner.ok{background:var(--sage-l);color:var(--ink)}
.banner .x{margin-left:auto;background:none;border:0;font-weight:800;color:var(--ink2)}
.sectitle{font-weight:800;font-size:19px;margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
.sectitle .linkbtn{margin-left:auto}
.help{background:var(--cream);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--ink2);margin-bottom:12px;line-height:1.5}
.help b{color:var(--ink)}
details.help summary{cursor:pointer;font-weight:800;color:var(--ink)}
.dash-edit .item{cursor:grab}
.handle{color:var(--ink3);font-size:20px}
.privacy .amt{filter:blur(7px);transition:filter .2s}
.privacy .amt:active{filter:none}
.lockscreen{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pinpad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:26px;font-weight:700}
.pindots{display:flex;gap:12px}.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--rose)}.pindots i.f{background:var(--rose)}
.welcome{text-align:center;padding:30px 10px}
.welcome .logo{font-size:64px}
.score{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.prevtbl input,.prevtbl select{border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:13px;background:var(--card);width:100%}
.dupe{background:var(--amber-l)}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
.kbd{font-family:ui-monospace,Menlo,monospace;background:var(--bg2);border-radius:6px;padding:1px 6px;font-size:12.5px}
.tag{font-size:11px;font-weight:800;color:var(--lilac-d)}

<script>
'use strict';
/* ==========================================================
   CORE — utilities, data model, storage, calculations
   All money is rounded to cents. All dates are 'YYYY-MM-DD'
   strings in Singapore time.
   ========================================================== */
const APP_VERSION = '1.0.0';
const DATA_VERSION = 1;
const TZ = 'Asia/Singapore';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const r2 = n => { n = +n || 0; const s = n < 0 ? -1 : 1; return s * Math.round(Math.abs(n) * 100 + 1e-7) / 100; };
const cents = n => Math.round((+n || 0) * 100 + ((+n || 0) < 0 ? -1e-7 : 1e-7));
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + cents(f(x)), 0) / 100;
const clone = o => JSON.parse(JSON.stringify(o));
const byId = (arr, id) => arr.find(x => x.id === id);

/* ---------- dates (Singapore time) ---------- */
function nowSG() {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
  const g = t => (p.find(x => x.type === t) || {}).value;
  let h = g('hour'); if (h === '24') h = '00';
  return { date: `${g('year')}-${g('month')}-${g('day')}`, time: `${h}:${g('minute')}` };
}
let __todayOverride = null; // used by tests only
const today = () => __todayOverride || nowSG().date;
const d2o = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const o2d = o => o.toISOString().slice(0, 10);
const addDays = (s, n) => { const o = d2o(s); o.setUTCDate(o.getUTCDate() + n); return o2d(o); };
const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate(); // m 1-12
function addMonths(s, n, anchorDay) {
  const [y, m, d] = s.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1 + n, 1));
  const last = daysInMonth(t.getUTCFullYear(), t.getUTCMonth() + 1);
  t.setUTCDate(Math.min(anchorDay || d, last));
  return o2d(t);
}
const diffDays = (a, b) => Math.round((d2o(b) - d2o(a)) / 86400000);
const ymOf = s => s.slice(0, 7);
const ymAdd = (ym, n) => addMonths(ym + '-01', n).slice(0, 7);
const ymStart = ym => ym + '-01';
const ymEnd = ym => { const [y, m] = ym.split('-').map(Number); return `${ym}-${String(daysInMonth(y, m)).padStart(2, '0')}`; };
const dow = s => d2o(s).getUTCDay(); // 0 Sun
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_L = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOWS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fmtD = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : '';
const fmtDShort = s => s ? `${+s.slice(8, 10)} ${MONTHS[+s.slice(5, 7) - 1]}` : '';
const fmtYM = ym => `${MONTHS_L[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
const fmtYMs = ym => `${MONTHS[+ym.slice(5, 7) - 1]} ${ym.slice(2, 4)}`;
const fmtDayHead = s => `${DOWS[dow(s)]}, ${fmtDShort(s)}`;
function parseDMY(s) { // accepts DD/MM/YYYY -> YYYY-MM-DD
  const m = String(s || '').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (!m) return null; let y = +m[3]; if (y < 100) y += 2000;
  const mo = +m[2], d = +m[1]; if (mo < 1 || mo > 12 || d < 1 || d > daysInMonth(y, mo)) return null;
  return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
function workingDays(ym, perWeek = 5) {
  const [y, m] = ym.split('-').map(Number); let c = 0;
  for (let d = 1; d <= daysInMonth(y, m); d++) { const w = dow(`${ym}-${String(d).padStart(2, '0')}`); if (perWeek >= 6 ? w !== 0 : (w !== 0 && w !== 6)) c++; }
  return perWeek === 5.5 ? c : c;
}

/* ---------- defaults ---------- */
const DASH_CARDS = ['balance', 'month', 'payday', 'budget', 'upcoming', 'debt', 'savings', 'health', 'recent', 'accounts'];
const DASH_NAMES = { balance: 'Cash & balances', month: 'Income & expenses', payday: 'Payday countdown', budget: 'Budget remaining', upcoming: 'Upcoming & overdue payments', debt: 'Outstanding debt', savings: 'Savings progress', health: 'Financial health', recent: 'Recent transactions', accounts: 'Accounts' };

function cat(id, name, icon, color, kind, subs) { return { id, name, icon, color, kind, subs: (subs || []).map(n => ({ id: id + '_' + n.toLowerCase().replace(/[^a-z0-9]+/g, '_'), name: n })) }; }
function defaultCategories() {
  return [
    cat('groceries', 'Groceries', '🛒', '#8FB3D9', 'expense', ['Supermarket', 'Wet market', 'Online groceries']),

    cat('subs', 'Subscriptions', '⭐', '#F0B84E', 'expense', ['Streaming', 'Software & apps', 'Memberships']),
    cat('shopping', 'Shopping', '🛍️', '#E7909F', 'expense', ['Clothing', 'Online shopping', 'Electronics']),
    cat('entertainment', 'Entertainment', '🎬', '#C58BB0', 'expense', ['Movies & shows', 'Hobbies', 'Games']),
    cat('outings', 'Family outings', '🧺', '#D99B6C', 'expense', ['Attractions', 'Day trips', 'Holidays']),
    cat('personal', 'Personal care', '💅', '#E8A0B4', 'expense', ['Hair', 'Skincare & beauty', 'Fitness']),

    cat('business', 'Business expenses', '💼', '#9E8FB2', 'expense', ['Product costs', 'Raw materials', 'Inventory purchases', 'Packaging', 'Shipping', 'Booth rental', 'Consignment fees', 'Platform fees', 'Advertising', 'Software subscriptions', 'Equipment', 'Customer refunds', 'Other business expenses']),
    cat('pets', 'Pets', '🐱', '#D7A86E', 'expense', ['Cat kibble', 'Wet food', 'Cat treats', 'Cat litter', 'Veterinary expenses', 'Grooming', 'Toys', 'Accessories']),
    cat('misc', 'Miscellaneous', '📦', '#A9A1A3', 'expense', ['Bank charges', 'Other']),
    cat('salary', 'Salary', '💰', '#6FA585', 'income', ['Basic salary', 'AWS', 'Bonus', 'Overtime', 'Allowances']),
    cat('bizincome', 'Business income', '🧾', '#79A98E', 'income', ['Sales revenue', 'Affiliate commissions', 'Royalties', 'Other business income']),
    cat('interest', 'Interest & cashback', '🏦', '#86B39A', 'income', ['Bank interest', 'Cashback & rewards']),
    cat('giftsin', 'Gifts received', '🎀', '#9CC5A9', 'income', ['Angpow & duit raya', 'Other gifts']),
    cat('otherin', 'Other income', '✨', '#A6CBB2', 'income', ['Government payouts', 'Sold items', 'Other'])
  ];
}
const COGS_SUBS = ['business_product_costs', 'business_raw_materials', 'business_inventory_purchases'];
function defaultBusinesses() {
  return [
    { id: 'biz_nncreations', name: 'N&N Creations', icon: '🎨', color: '#C27C8E' },
    { id: 'biz_baredigitals', name: 'BareDigitalsCo', icon: '💻', color: '#8E7BB5' },
    { id: 'biz_nnpublishing', name: 'N&N Publishing', icon: '📖', color: '#B07F5C' },
    { id: 'biz_tiktok', name: 'TikTok Affiliate', icon: '🎵', color: '#5E9474' },
    { id: 'biz_youtube', name: 'YouTube', icon: '▶️', color: '#D9705F' },
    { id: 'biz_other', name: 'Other side businesses', icon: '✨', color: '#A9A1A3' }
  ];
}
function defaultSalaryCfg() {
  return {
    basic: 0, awsMonths: 1, awsPayMonth: 12, showAwsMonthly: true,
    dailyMethod: 'workdays', customDaily: 0, workDaysPerWeek: 5,
    hoursPerWeek: 44, otMethod: 'formula', otMultiplier: 1.5, otCustomHourly: 0,
    meal: 0, otherAllow: 0, cpfOnAllowances: true, cpfOnOT: true,
    cpfRate: 20, cpfEmployerRate: 17, owCeiling: 8000, roundDown: true,
    otherDeductions: 0, reimbursements: 0, payAccountId: ''
  };
}
function defaultState() {
  return {
    version: DATA_VERSION, createdAt: today(), appVersion: APP_VERSION,
    settings: {
      appName: 'Blush Money', dark: 'auto', privacy: false, defaultView: 'all', defaultAccount: '', currency: 'SGD', symbol: 'S$', dateFormat: 'DD/MM/YYYY',
      payday: { day: 25, weekend: 'before', expected: 0 },
      members: { me: 'Me', partner: 'Husband' }, myShare: 50,
      dashCards: DASH_CARDS.map(id => ({ id, on: true })),
      lock: null, lastBackup: null, estTransportDay: 5, estFoodDay: 12, estOtherEssentials: 0, onboarded: false
    },
    accounts: [], categories: defaultCategories(), txns: [], bills: [], debts: [], goals: [],
    budgets: {}, rollover: {}, salary: { cfg: defaultSalaryCfg(), payslips: [], increments: [] },
    bonuses: [], businesses: defaultBusinesses(), merchantMap: {}, inbox: []
  };
}

/* ---------- migration (future-proofing) ---------- */
function migrate(d) {
  if (!d || typeof d !== 'object') throw new Error('Not a valid data file');
  const base = defaultState();
  d.version = d.version || 1;
  // fill missing top-level keys
  for (const k of Object.keys(base)) if (d[k] === undefined) d[k] = base[k];
  for (const k of Object.keys(base.settings)) if (d.settings[k] === undefined) d.settings[k] = base.settings[k];
  for (const k of Object.keys(base.salary.cfg)) if (d.salary.cfg[k] === undefined) d.salary.cfg[k] = base.salary.cfg[k];
  // make sure every dashboard card exists
  const have = new Set(d.settings.dashCards.map(c => c.id));
  DASH_CARDS.forEach(id => { if (!have.has(id)) d.settings.dashCards.push({ id, on: true }); });
  ['txns', 'accounts', 'bills', 'debts', 'goals', 'bonuses', 'categories', 'businesses', 'inbox'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  d.debts.forEach(x => { x.events = x.events || []; });
  d.goals.forEach(x => { x.contribs = x.contribs || []; });
  d.bills.forEach(x => { x.occ = x.occ || {}; });
  d.bonuses.forEach(x => { x.scenarios = x.scenarios || []; });
  // future: if (d.version < 2) {...; d.version = 2}
  d.version = DATA_VERSION;
  return d;
}
function validateBackup(d) {
  const errs = [];
  if (!d || typeof d !== 'object') return ['File is not a backup from this app.'];
  if (!d.settings) errs.push('Missing settings');
  ['txns', 'accounts', 'categories'].forEach(k => { if (!Array.isArray(d[k])) errs.push('Missing ' + k); });
  if (Array.isArray(d.txns)) {
    const bad = d.txns.filter(t => !t.id || !t.type || !/^\d{4}-\d{2}-\d{2}$/.test(t.date || '') || !isFinite(+t.amount)).length;
    if (bad) errs.push(bad + ' transaction(s) are damaged');
  }
  if (d.version > DATA_VERSION) errs.push('This backup is from a newer version of the app. Update the app first.');
  return errs;
}

/* ---------- storage: IndexedDB with localStorage fallback ---------- */
const DB = {
  db: null, mode: 'idb', lastError: null,
  open() {
    return new Promise(res => {
      try {
        if (!window.indexedDB) { this.mode = 'ls'; return res(); }
        const rq = indexedDB.open('blush-money', 1);
        rq.onupgradeneeded = () => { const db = rq.result; if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); if (!db.objectStoreNames.contains('files')) db.createObjectStore('files'); };
        rq.onsuccess = () => { this.db = rq.result; res(); };
        rq.onerror = () => { this.mode = 'ls'; res(); };
        setTimeout(() => { if (!this.db) { this.mode = 'ls'; res(); } }, 4000);
      } catch (e) { this.mode = 'ls'; res(); }
    });
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      try {
        const tx = this.db.transaction(store, mode); const st = tx.objectStore(store); let out;
        const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
        tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('aborted'));
      } catch (e) { rej(e); }
    });
  },
  async get(key, store = 'kv') {
    if (this.mode === 'ls') { const v = localStorage.getItem('bm_' + store + '_' + key); return v ? JSON.parse(v) : undefined; }
    return this._tx(store, 'readonly', st => st.get(key));
  },
  async set(key, val, store = 'kv') {
    if (this.mode === 'ls') { localStorage.setItem('bm_' + store + '_' + key, JSON.stringify(val)); return; }
    return this._tx(store, 'readwrite', st => st.put(val, key));
  },
  async del(key, store = 'kv') {
    if (this.mode === 'ls') { localStorage.removeItem('bm_' + store + '_' + key); return; }
    return this._tx(store, 'readwrite', st => st.delete(key));
  },
  async keys(store = 'files') {
    if (this.mode === 'ls') return Object.keys(localStorage).filter(k => k.startsWith('bm_' + store + '_')).map(k => k.slice(('bm_' + store + '_').length));
    return this._tx(store, 'readonly', st => st.getAllKeys());
  }
};

let S = null;            // the whole app state
let saveTimer = null, saving = Promise.resolve();
function save(immediate) {
  clearTimeout(saveTimer);
  const go = () => {
    saving = saving.then(async () => {
      try { S.savedAt = new Date().toISOString(); await DB.set('state', S); DB.lastError = null; window.onSaved && window.onSaved(); }
      catch (e) { DB.lastError = e; window.onSaveError && window.onSaveError(e); }
    });
    return saving;
  };
  if (immediate) return go();
  saveTimer = setTimeout(go, 0);
  return saving;
}
async function snapshot(label) { // safety copy before big/destructive changes
  try { await DB.set('snapshot', { at: new Date().toISOString(), label, data: S }); } catch (e) { console.warn(e); }
}
async function loadState() {
  await DB.open();
  let d;
  try { d = await DB.get('state'); } catch (e) { DB.lastError = e; }
  S = d ? migrate(d) : defaultState();
  return S;
}

/* ---------- lookups ---------- */
const acc = id => byId(S.accounts, id);
const catById = id => byId(S.categories, id);
const subName = (catId, subId) => { const c = catById(catId); const s = c && c.subs.find(x => x.id === subId); return s ? s.name : ''; };
const biz = id => byId(S.businesses, id);
const memberName = k => k === 'partner' ? S.settings.members.partner : k === 'joint' ? 'Joint' : 'You';

/* ---------- transactions ---------- */
const TXN_TYPES = { expense: 'Expense', income: 'Income', transfer: 'Transfer', refund: 'Refund', reimbursement: 'Reimbursement', adjustment: 'Balance adjustment', settlement: 'Household settlement' };
function effects(t) {
  const a = +t.amount || 0;
  switch (t.type) {
    case 'income': case 'refund': case 'reimbursement': return t.accountId ? [{ acc: t.accountId, amt: a }] : [];
    case 'expense': return t.accountId ? [{ acc: t.accountId, amt: -a }] : [];
    case 'transfer': return [t.accountId && { acc: t.accountId, amt: -a }, t.toAccountId && { acc: t.toAccountId, amt: a }].filter(Boolean);
    case 'adjustment': return t.accountId ? [{ acc: t.accountId, amt: a }] : []; // signed amount
    case 'settlement': return t.accountId ? [{ acc: t.accountId, amt: t.direction === 'in' ? a : -a }] : [];
  }
  return [];
}
function balances(upto) {
  const m = {}; S.accounts.forEach(a => m[a.id] = (!upto || !a.openingDate || a.openingDate <= upto) ? cents(a.opening || 0) : 0);
  for (const t of S.txns) { if (upto && t.date > upto) continue; for (const e of effects(t)) if (m[e.acc] !== undefined) m[e.acc] += cents(e.amt); }
  for (const k in m) m[k] = m[k] / 100;
  return m;
}
function accBalance(id, upto) { return balances(upto)[id] || 0; }
const isAsset = a => a.type !== 'credit';
function cashSummary(upto) {
  const b = balances(upto); let avail = 0, total = 0, cardOwed = 0, joint = 0, excluded = 0;
  for (const a of S.accounts) {
    if (a.archived) continue; const v = cents(b[a.id]);
    if (a.type === 'credit') { cardOwed += -v; continue; }
    total += v;
    if (a.owner === 'joint') joint += v;
    if (a.excludeCash || a.owner === 'joint') excluded += v; else avail += v;
  }
  return { avail: avail / 100, total: total / 100, cardOwed: cardOwed / 100, joint: joint / 100, excluded: excluded / 100, b };
}
function inView(t, view, bizId) {
  if (!view || view === 'all') return true;
  if (view === 'business') return t.scope === 'business' && (!bizId || t.bizId === bizId);
  return (t.scope || 'personal') === view;
}
function txnsIn(view, from, to, bizId) { return S.txns.filter(t => t.date >= from && t.date <= to && inView(t, view, bizId)); }
// signed contribution of a txn to "spending" (expense positive, refund/reimbursement negative)
function spendAmt(t) { if (t.type === 'expense') return +t.amount; if ((t.type === 'refund' || t.type === 'reimbursement') && t.catId && (catById(t.catId) || {}).kind !== 'income') return -t.amount; return 0; }
function totals(list) {
  let inc = 0, exp = 0, other = 0;
  for (const t of list) {
    if (t.type === 'income') inc += cents(t.amount);
    else { const s = spendAmt(t); if (s) exp += cents(s); else if (t.type === 'reimbursement') other += cents(t.amount); }
  }
  return { income: inc / 100, expense: exp / 100, net: (inc - exp) / 100, otherIn: other / 100 };
}
function byCategory(list) {
  const m = {}; for (const t of list) { const s = spendAmt(t); if (!s) continue; const k = t.catId || 'misc'; m[k] = (m[k] || 0) + cents(s); }
  return Object.entries(m).map(([k, v]) => ({ catId: k, amount: v / 100 })).filter(x => Math.abs(x.amount) > 0.001).sort((a, b) => b.amount - a.amount);
}
function dupCandidates(t, excludeId) { // possible duplicates of a transaction
  return S.txns.filter(x => x.id !== excludeId && x.type === t.type && Math.abs(+x.amount - +t.amount) < 0.005 && Math.abs(diffDays(x.date, t.date)) <= 1 &&
    (!t.accountId || !x.accountId || x.accountId === t.accountId) && simDesc(x.desc, t.desc));
}
function simDesc(a, b) { a = String(a || '').toLowerCase().replace(/[^a-z0-9]/g, ''); b = String(b || '').toLowerCase().replace(/[^a-z0-9]/g, ''); if (!a || !b) return true; return a.includes(b.slice(0, 5)) || b.includes(a.slice(0, 5)); }
function frequentMerchants(n = 8) {
  const m = {}; S.txns.slice(-400).forEach(t => { if (t.type !== 'expense' || !t.desc) return; const k = t.desc.trim(); m[k] = m[k] || { desc: k, count: 0, catId: t.catId, subId: t.subId, accountId: t.accountId, scope: t.scope, amount: t.amount }; m[k].count++; m[k].catId = t.catId; m[k].subId = t.subId; m[k].amount = t.amount; });
  return Object.values(m).sort((a, b) => b.count - a.count).slice(0, n);
}
function learnMerchant(t) { if (!t.desc || !t.catId) return; S.merchantMap[t.desc.trim().toLowerCase()] = { catId: t.catId, subId: t.subId || '' }; }

/* ---------- household ---------- */
function householdBalance(from = '0000-01-01', to = '9999-12-31') {
  // positive = partner owes me; negative = I owe partner
  let owed = 0, paidMe = 0, paidPartner = 0, paidJoint = 0, myShareTotal = 0, partnerShareTotal = 0;
  for (const t of S.txns) {
    if (t.scope !== 'household' || t.date < from || t.date > to) continue;
    if (t.type === 'settlement') { owed += (t.direction === 'out' ? 1 : -1) * cents(t.amount); continue; }
    const s = cents(spendAmt(t)); if (!s) continue;
    const share = (t.myShare ?? S.settings.myShare) / 100;
    const mine = Math.round(s * share), theirs = s - mine;
    myShareTotal += mine; partnerShareTotal += theirs;

  const key = await deriveKey(pass, salt); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
  return JSON.stringify({ app: 'blush-money', encrypted: true, v: 1, kdf: 'PBKDF2-SHA256-250000', salt: b64(salt), iv: b64(iv), data: b64(ct) });
}
async function decryptText(obj, pass) {
  const key = await deriveKey(pass, unb64(obj.salt)); const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(obj.iv) }, key, unb64(obj.data));
  return new TextDecoder().decode(pt);
}
async function sha256(text) { if (hasCrypto()) { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return b64(h); } let h = 0; for (const c of text) h = (h * 31 + c.charCodeAt(0)) | 0; return 'x' + h; }

function healthScore(ym) {
  const t = totals(txnsIn('all', ymStart(ym), ymEnd(ym))); const items = []; let score = 50;
  if (t.income > 0) { const sr = (t.income - t.expense) / t.income; score += Math.max(-20, Math.min(20, sr * 80)); items.push({ ok: sr >= 0.1, warn: sr >= 0 && sr < 0.1, text: `You kept ${Math.round(sr * 100)}% of your income this month` }); }
  else items.push({ warn: true, text: 'No income recorded for this month yet' });
  const bs = budgetSummary(ym, 'all'); if (bs.count) { score += bs.pct <= 100 ? 10 : -10; items.push({ ok: bs.pct <= 90, warn: bs.pct > 90 && bs.pct <= 100, text: `Budget ${bs.pct}% used${bs.over ? `, ${bs.over} over` : ''}` }); }
  const od = overdueList('all').length; score += od ? -Math.min(20, od * 7) : 10; items.push({ ok: !od, text: od ? `${od} overdue payment${od > 1 ? 's' : ''}` : 'No overdue payments' });
  const dt = debtTotals(); const inc = t.income || expectedSalary();
  if (dt.monthly && inc) { const r = dt.monthly / inc; score += r < 0.3 ? 5 : r < 0.5 ? -5 : -15; items.push({ ok: r < 0.3, warn: r >= 0.3 && r < 0.5, text: `Debt repayments are ${Math.round(r * 100)}% of income` }); }
  const ef = S.goals.find(g => /emergency/i.test(g.name)); if (ef) { const gi = goalInfo(ef); score += gi.pct >= 50 ? 5 : 0; items.push({ ok: gi.pct >= 50, warn: gi.pct < 50, text: `Emergency fund ${gi.pct}% complete` }); }
  return { score: Math.max(0, Math.min(100, Math.round(score))), items };
}

const ACC_TYPES = { bank: 'Bank account', cash: 'Cash', savings: 'Savings account', ewallet: 'E-wallet', credit: 'Credit card', business: 'Business account', other: 'Other' };
function txnSort(a, b) { return b.date.localeCompare(a.date) || String(b.time || '').localeCompare(String(a.time || '')) || String(b.createdAt || '').localeCompare(String(a.createdAt || '')); }
function txnIcon(t) { if (t.type === 'transfer') return '⇄'; if (t.type === 'adjustment') return '⚖️'; if (t.type === 'settlement') return '🤝'; const c = catById(t.catId); return c ? c.icon : t.type === 'income' ? '💰' : '🧾'; }
function txnRow(t) {
  const c = catById(t.catId); const a = acc(t.accountId); let sub = fmtDShort(t.date);
  if (t.type === 'transfer') sub += ` · ${esc((a || {}).name || '?')} → ${esc((acc(t.toAccountId) || {}).name || '?')}`;
  else if (t.scope === 'household') sub += ` · Paid by ${esc(memberName(t.paidBy || 'me'))}${a ? ` (${esc(a.name)})` : ''}`;
  else if (a) sub += ` · ${esc(a.name)}`;
  if (t.scope === 'business' && t.bizId) sub += ` · ${esc((biz(t.bizId) || {}).name || '')}`;
  let amt, right;
  if (t.type === 'income') amt = money(t.amount, { sign: true, color: true });
  else if (t.type === 'expense') amt = money(-t.amount, { color: true });
  else if (t.type === 'refund' || t.type === 'reimbursement') amt = money(t.amount, { sign: true, color: true });
  else if (t.type === 'adjustment') amt = money(t.amount, { sign: true, color: true });
  else if (t.type === 'settlement') amt = money(t.direction === 'in' ? t.amount : -t.amount, { sign: true });
  else amt = money(t.amount);
  right = t.type === 'transfer' ? 'Transfer' : t.type === 'expense' || t.type === 'income' ? esc((c || {}).name || '') : TXN_TYPES[t.type];
  return `<button class="item" data-a="openTxn" data-id="${t.id}"><div class="ic" style="${c ? `background:${c.color}22` : ''}">${txnIcon(t)}</div><div class="mid"><div class="t1">${esc(t.desc || (c || {}).name || TXN_TYPES[t.type])}${t.receiptId ? ' 📎' : ''}${t.sample ? ' <span class="badge sample">sample</span>' : ''}</div><div class="t2">${sub}</div></div><div class="end"><div class="amt-v">${amt}</div><div class="t2">${right}</div></div></button>`;
}
const KIND_ICON = { bill: '🧾', utility: '⚡', loan: '🏦', cc: '💳', subscription: '⭐', school: '🏫', studentcare: '🎒', insurance: '🛡️', planned: '🛍️', income: '💰', other: '📌' };

function planBonus() {

      ${sc ? bonusScenarioView(bn, sc) : ''}

function bonusScenarioView(bn, sc) {

    if (l.kind === 'debt') { const d = byId(S.debts, l.targetId); if (d) { const st = debtState(d); const before = payoffMonths(st.balance, monthlyRate(d), +d.instalment), after = payoffMonths(Math.max(0, st.balance - l.amount), monthlyRate(d), +d.instalment); eff = `${esc(d.lender)}: ${moneyPlain(st.balance)} → ${moneyPlain(Math.max(0, st.balance - l.amount))}${before && after && before.months != null && after.months != null ? `, ${before.months - after.months} fewer months, ~${moneyPlain(Math.max(0, before.interest - after.interest))} less interest` : ''}`; } }
    if (l.kind === 'goal') { const g = byId(S.goals, l.targetId); if (g) { const i = goalInfo(g); eff = `${esc(g.name)}: ${i.pct}% → ${Math.min(100, Math.round((i.saved + l.amount) / (i.target || 1) * 100))}%`; } }
    return `<div class="kv"><span>${esc(l.label)} <span class="muted small">${pct}%</span>${eff ? `<div class="tiny muted">${eff}</div>` : ''}</span><b>${money(l.amount)}</b></div>`; }).join('')}<button class="linkbtn" data-a="editScn" data-id="${bn.id}" data-s="${sc.id}">Edit this scenario</button></div>`;
}

      f.onsubmit = e => { e.preventDefault(); sync(); const i = bn.scenarios.findIndex(s => s.id === sc.id); if (i >= 0) bn.scenarios[i] = sc; else bn.scenarios.push(sc); bn.active = sc.id; closeSheet(ov); commit('Scenario saved'); };
    };

};

/* ---------------- PAYDAY ---------------- */
function planPayday() {
  U.scn = U.scn || {}; const p = cashflowPlan(U.scn); const s = S.settings;
  let h = `<div class="card hero"><div class="lbl">Days until payday</div><div class="big">${p.days} <span style="font-size:16px">day${p.days === 1 ? '' : 's'} · ${fmtD(p.payday)}</span></div><div class="grid2"><div class="stat"><div class="l">Available cash now</div><div class="v">${money(p.availNow)}</div></div><div class="stat"><div class="l">Suggested per day</div><div class="v">${money(p.perDay)}</div></div></div></div>`;
  if (Object.keys(U.scn).length) h += `<div class="banner warn">🧪 What-if mode — numbers below include your test changes. Your records are not changed. <button class="x" data-a="clearScn">Reset</button></div>`;
  h += `<div class="card"><h3>Between now and payday</h3>
    <div class="kv"><span>Available cash</span><b>${money(p.availNow)}</b></div>
    ${p.incomeTotal ? `<div class="kv"><span>Expected income before payday <span class="badge est">estimate</span></span><b class="pos">+${moneyPlain(p.incomeTotal)}</b></div>` : ''}
    <div class="kv"><span>Payments due before payday (${p.due.length})</span><b class="neg">${money(-p.billsTotal)}</b></div>
    ${p.overdueTotal ? `<div class="kv"><span>Overdue payments carried forward</span><b class="neg">${money(-p.overdueTotal)}</b></div>` : ''}
    <div class="kv"><span>Transport (${moneyPlain(U.scn.transportDay ?? s.estTransportDay)}/day × ${p.days}) <span class="badge est">estimate</span></span><b class="neg">${money(-p.transport)}</b></div>
    <div class="kv"><span>Food (${moneyPlain(U.scn.foodDay ?? s.estFoodDay)}/day × ${p.days}) <span class="badge est">estimate</span></span><b class="neg">${money(-p.food)}</b></div>
    <div class="kv"><span>Other essentials <span class="badge est">estimate</span></span><b class="neg">${money(-p.other)}</b></div>
    ${p.extraSpend ? `<div class="kv"><span>What-if extra spending</span><b class="neg">${money(-p.extraSpend)}</b></div>` : ''}
    <div class="kv total"><span>Remaining disposable cash</span><b class="${p.disposable < 0 ? 'neg' : 'pos'}">${money(p.disposable)}</b></div>
    <div class="kv"><span>Projected balance after payday (+${moneyPlain(p.salary)} expected pay)</span><b>${money(p.afterPay)}</b></div>
    ${p.disposable < 0 ? `<div class="banner err mt">You may be short by ${moneyPlain(-p.disposable)} before payday. Consider deferring a low-priority payment or trimming daily spending.</div>` : ''}</div>`;
  // projection chart: daily balance
  const days = Math.max(1, p.days); const labels = [], conf = [], est = []; let bal = p.availNow;
  const byDay = {}; [...p.due, ...p.overdue].forEach(o => { const d = o.date < p.today ? p.today : o.date; byDay[d] = (byDay[d] || 0) - o.remaining; }); p.incomeDue.forEach(o => byDay[o.date] = (byDay[o.date] || 0) + o.remaining);
  const daily = days ? (p.transport + p.food + p.other + p.extraSpend) / days : 0; let balE = bal;
  for (let i = 0; i <= days; i++) { const d = addDays(p.today, i); bal += byDay[d] || 0; balE += (byDay[d] || 0) - (i ? daily : 0); labels.push(fmtDShort(d)); conf.push(r2(bal)); est.push(r2(balE)); }
  h += `<div class="card"><h3>Cash projection to payday</h3>${lineChart(labels, [{ name: 'After scheduled payments', color: '#C27C8E', values: conf }, { name: 'Including daily estimates', color: '#8E7BB5', values: est, dash: true }])}</div>`;
  if (p.due.length || p.overdue.length) h += `<div class="sectitle">Due before payday</div><div class="list">${[...p.overdue, ...p.due].map(occRow).join('')}</div>`;
  h += `<div class="card cream"><h3>🧪 Try a what-if <span class="tiny muted">(not saved)</span></h3><form id="scnf"><div class="frow">${F.num('extraSpend', 'Extra one-off spending', U.scn.extraSpend || '')}${F.num('extraCash', 'Extra money coming in', U.scn.extraCash || '')}</div><div class="frow">${F.num('transportDay', 'Transport per day', U.scn.transportDay ?? '', `placeholder="${s.estTransportDay}"`)}${F.num('foodDay', 'Food per day', U.scn.foodDay ?? '', `placeholder="${s.estFoodDay}"`)}</div><div class="frow">${F.num('salary', 'Pay amount', U.scn.salary ?? '', `placeholder="${expectedSalary()}"`)}${F.date('payday', 'Payday', U.scn.payday || '')}</div><button class="btn soft block">Update what-if</button></form></div>`;
  h += `<button class="btn ghost block" data-a="paydaySettings">${icon('gear')} Payday & daily estimates</button>`;
  setTimeout(() => { const f = $('#scnf'); if (f) f.onsubmit = e => { e.preventDefault(); const v = formData(f); const o = {}; for (const [k, x] of Object.entries(v)) if (x !== '') o[k] = k === 'payday' ? x : num(x); U.scn = o; render(); }; }, 0);
  return h;
}
A.clearScn = () => { U.scn = {}; render(); };
A.paydaySettings = () => {
  const s = S.settings;
  openSheet('Payday settings', `<form><div class="frow">${F.num('day', 'Payday (day of month)', s.payday.day)}${F.sel('weekend', 'If it falls on a weekend', [['before', 'Paid on the Friday before'], ['after', 'Paid on the Monday after'], ['same', 'Same day']], s.payday.weekend)}</div>
    ${F.num('expected', 'Expected take-home pay', s.payday.expected || '', '', 'Leave empty to use the Salary calculator estimate.')}
    <div class="frow">${F.num('estTransportDay', 'Transport per day', s.estTransportDay)}${F.num('estFoodDay', 'Food per day', s.estFoodDay)}</div>${F.num('estOtherEssentials', 'Other essentials until payday (total)', s.estOtherEssentials)}<button class="btn block">Save</button></form>`, (b, ov) => {
    b.querySelector('form').onsubmit = e => { e.preventDefault(); const v = formData(e.target); s.payday = { day: Math.min(31, Math.max(1, Math.round(num(v.day)) || 25)), weekend: v.weekend, expected: r2(num(v.expected)) }; s.estTransportDay = r2(num(v.estTransportDay)); s.estFoodDay = r2(num(v.estFoodDay)); s.estOtherEssentials = r2(num(v.estOtherEssentials)); closeSheet(ov); commit('Saved'); };
  });
};

  const list = txnsIn('household', ymStart(ym), ymEnd(ym)).sort(txnSort); const t = totals(list);
  let h = monthNav();
  h += `<div class="card ${Math.abs(all.owed) < 0.01 ? 'sage' : 'lilac'}"><div class="lbl">Household balance (all time)</div><div class="big">${Math.abs(all.owed) < 0.01 ? 'All settled 🤝' : all.owed > 0 ? `${esc(m.partner)} owes you ${moneyPlain(all.owed)}` : `You owe ${esc(m.partner)} ${moneyPlain(-all.owed)}`}</div>${Math.abs(all.owed) >= 0.01 ? `<button class="btn sm mt" data-a="newTxn" data-type="settlement">🤝 Settle up</button>` : ''}</div>`;
  h += `<div class="card"><h3>🏠 ${fmtYM(ym)}</h3><div class="grid2"><div class="stat"><div class="l">Household spending</div><div class="v">${money(t.expense)}</div></div><div class="stat"><div class="l">Household income</div><div class="v">${money(t.income)}</div></div></div>
    <div class="kv mt"><span>Paid by you</span><b>${money(mon.paidMe)}</b></div><div class="kv"><span>Paid by ${esc(m.partner)}</span><b>${money(mon.paidPartner)}</b></div>${mon.paidJoint ? `<div class="kv"><span>Paid from joint</span><b>${money(mon.paidJoint)}</b></div>` : ''}
    <div class="kv"><span>Your share of costs</span><b>${money(mon.myShare)}</b></div><div class="kv"><span>${esc(m.partner)}'s share</span><b>${money(mon.partnerShare)}</b></div></div>`;
  const cats = byCategory(list); if (cats.length) h += `<div class="card"><h3>By category</h3>${donut(cats.map(c => ({ label: (catById(c.catId) || {}).name || c.catId, value: c.amount, color: (catById(c.catId) || {}).color })))}</div>`;
  const hb = S.bills.filter(b => b.scope === 'household' && !b.archived); if (hb.length) h += `<div class="sectitle">Household bills</div><div class="list">${hb.map(billRow).join('')}</div>`;
  const hg = S.goals.filter(g => g.scope === 'household' && !g.archived); if (hg.length) h += `<div class="sectitle">Household savings</div><div class="list">${hg.map(g => { const i = goalInfo(g); return `<button class="item" data-a="openGoal" data-id="${g.id}"><div class="ic">${g.icon}</div><div class="mid"><div class="t1">${esc(g.name)}</div><div class="t2">${i.pct}% of ${moneyPlain(i.target)}</div></div><div class="end amt-v">${money(i.saved)}</div></button>`; }).join('')}</div>`;
  h += `<div class="sectitle">Transactions <button class="linkbtn" data-a="newHH">+ Add</button></div>${list.length ? `<div class="list">${list.map(txnRow).join('')}</div>` : '<div class="empty small">No household transactions this month</div>'}`;
  h += `<button class="btn ghost block" data-a="hhSettings">${icon('gear')} Names & default split</button><div class="help mt">Household spending paid by ${esc(m.partner)} is tracked for sharing, but never changes <b>your</b> account balances. In the “All” view each expense is counted once.</div>`;
  return h;
}

/* ---------------- BUSINESS ---------------- */
function planBusiness() {
  const per = U.bizPer || 'month'; const ym = U.month; const [from, to] = per === 'year' ? [ym.slice(0, 4) + '-01-01', ym.slice(0, 4) + '-12-31'] : [ymStart(ym), ymEnd(ym)];
  const sel = U.bizId; const s = bizSummary(sel, from, to);
  let h = `<div class="chips"><button class="chip ${!sel ? 'on' : ''}" data-a="bizSel" data-v="">All businesses</button>${S.businesses.filter(b => !b.archived).map(b => `<button class="chip ${sel === b.id ? 'on' : ''}" data-a="bizSel" data-v="${b.id}">${b.icon} ${esc(b.name)}</button>`).join('')}</div>`;
  h += `<div class="seg sm"><button data-a="bizPer" data-v="month" class="${per === 'month' ? 'on' : ''}">Month</button><button data-a="bizPer" data-v="year" class="${per === 'year' ? 'on' : ''}">Year</button></div>` + (per === 'month' ? monthNav() : `<div class="monthnav"><button class="iconbtn" data-a="month" data-d="-12">${icon('left')}</button><b class="t">${ym.slice(0, 4)}</b><button class="iconbtn" data-a="month" data-d="12">${icon('right')}</button></div>`);
  h += `<div class="card hero"><div class="lbl">Net profit</div><div class="big">${money(s.net)}</div><div class="grid3"><div class="stat"><div class="l">Revenue</div><div class="v">${money(s.revenue)}</div></div><div class="stat"><div class="l">Expenses</div><div class="v">${money(s.expenses)}</div></div><div class="stat"><div class="l">Margin</div><div class="v">${s.margin == null ? '—' : s.margin + '%'}</div></div></div></div>`;
  h += `<div class="card">${s.gross != null ? `<div class="kv"><span>Product costs (materials, inventory)</span><b>${money(s.cogs)}</b></div><div class="kv"><span>Gross profit</span><b>${money(s.gross)} (${s.grossMargin}%)</b></div>` : '<div class="small muted">Gross profit appears once you record product costs, raw materials or inventory purchases.</div>'}
    ${Object.entries(s.sources).map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b>${money(v / 100)}</b></div>`).join('')}</div>`;
  const cats = {}; s.list.forEach(t => { const v = spendAmt(t); if (v) { const k = subName(t.catId, t.subId) || (catById(t.catId) || {}).name || 'Other'; cats[k] = (cats[k] || 0) + v; } });
  if (Object.keys(cats).length) h += `<div class="card"><h3>Expenses by type</h3>${donut(Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([k, v], i) => ({ label: k, value: r2(v) })))}</div>`;
  const months = Array.from({ length: 12 }, (_, i) => ymAdd(ym, i - 11)); const ms = months.map(m => bizSummary(sel, ymStart(m), ymEnd(m)));

  h += `<div class="btnrow"><button class="btn" data-a="bizAdd" data-type="income">${icon('plus')} Revenue</button><button class="btn soft" data-a="bizAdd" data-type="expense">${icon('plus')} Expense</button></div>`;
  h += `<div class="sectitle">Transactions</div>${s.list.length ? `<div class="list">${s.list.sort(txnSort).map(txnRow).join('')}</div>` : '<div class="empty small">No business transactions in this period</div>'}`;

  return h;
}

function storageExplainer() {

  <b>Please know:</b><br>• <b>Private / incognito windows</b> delete everything when closed.<br>• <b>Clearing browser data / website data</b> for this site erases your records.<br>• Data does <b>not</b> sync between devices or browsers — Safari and Chrome on the same phone keep separate copies.<br>• iPhone/iPad may remove data from sites you haven't opened for several weeks unless the app is <b>added to your Home Screen</b>.<br>• So: <b>back up regularly</b> (Settings → Back up) and keep the file somewhere safe (e.g. your own cloud drive).<br>• To move to another device, back up here and restore there.`;

function helpText() {
  return `<b>Transfers</b> (between your accounts, card repayments, into savings) are never income or spending.<br><b>Refunds</b> link to the original expense and reduce that category's spending.<br><b>Credit cards</b>: purchases are spending; the repayment is a transfer to the card.<br><b>Household</b>: expenses paid by your partner don't change your balances; the app tracks who owes whom.<br><b>Business</b>: sales are business income; moving money to your personal account is a transfer.<br><b>Planned payments</b>: "Mark paid" records one transaction — if it was already recorded (e.g. imported), you'll be offered to link it instead, so nothing is duplicated.<br><b>Estimates vs actual</b>: anything marked "estimate" (bills, payday projections, salary calculator, expected bonuses) is never treated as real money until you record it.`;

A.setPin = async () => {
  if (S.settings.lock) { if (await confirmBox('Remove PIN', 'Turn off the app PIN?', 'Remove', false)) { S.settings.lock = null; commit('PIN removed'); } return; }
  openSheet('Set app PIN', `<form><div class="help">Choose 4–6 digits. This only hides the screen; it is not encryption. If you forget it, you'll need a backup to restore.</div>${F.text('p1', 'PIN', '', 'inputmode="numeric" type="password" maxlength="6" autocomplete="off"')}${F.text('p2', 'Confirm PIN', '', 'inputmode="numeric" type="password" maxlength="6" autocomplete="off"')}<button class="btn block">Save PIN</button></form>`, (b, ov) => {
    b.querySelector('form').onsubmit = async e => { e.preventDefault(); const v = formData(e.target); if (!/^\d{4,6}$/.test(v.p1)) return toast('Use 4 to 6 digits'); if (v.p1 !== v.p2) return toast('PINs do not match'); const salt = uid(); S.settings.lock = { salt, hash: await sha256(salt + v.p1), len: v.p1.length }; closeSheet(ov); commit('PIN set'); };

/* ---------- backup & restore ---------- */
async function buildBackup(withReceipts = true) {
  await save(true);
  const data = clone(S); data.exportedAt = new Date().toISOString(); data.app = 'blush-money'; data.appVersion = APP_VERSION;
  if (withReceipts) { data.files = {}; try { const keys = await DB.keys('files'); for (const k of keys) data.files[k] = await DB.get(k, 'files'); } catch (e) { } }
  return data;
}
const stamp = () => today() + '_' + nowSG().time.replace(':', '');
A.quickBackup = () => A.backup();
A.backup = async () => {
  const withR = (await DB.keys('files').catch(() => [])).length > 0;
  const data = await buildBackup(withR);
  download(`blush-money-backup_${stamp()}.json`, JSON.stringify(data), 'application/json');
  S.settings.lastBackup = new Date().toISOString(); save(); render(); toast('Backup downloaded — keep it somewhere safe');
};
A.backupEnc = () => {
  if (!hasCrypto()) return confirmBox('Not available here', 'Encryption needs a secure connection (https) or a local file opened in Chrome/Edge/Safari. Use a normal backup and store it in a protected place, or open the app from its https address.', 'OK', false);
  openSheet('Encrypted backup', `<form><div class="help">The backup is locked with AES-256 encryption using your password. <b>If you forget the password, the backup cannot be opened by anyone — including you.</b></div>${F.text('p1', 'Password', '', 'type="password" autocomplete="new-password"')}${F.text('p2', 'Confirm password', '', 'type="password" autocomplete="new-password"')}<button class="btn block">${icon('lock')} Create encrypted backup</button></form>`, (b, ov) => {
    b.querySelector('form').onsubmit = async e => { e.preventDefault(); const v = formData(e.target); if (v.p1.length < 8) return toast('Use at least 8 characters'); if (v.p1 !== v.p2) return toast('Passwords do not match'); toast('Encrypting…'); const data = await buildBackup(true); const enc = await encryptText(JSON.stringify(data), v.p1); download(`blush-money-backup_${stamp()}.encrypted.json`, enc, 'application/json'); S.settings.lastBackup = new Date().toISOString(); save(); closeSheet(ov); render(); toast('Encrypted backup downloaded'); };
  });
};
A.restoreBackup = () => {
  openSheet('Restore a backup', `<div class="help">Choose a backup file made by this app (.json). You'll see what's inside before anything changes. Your current data is kept as a safety copy.</div><input type="file" class="inp" accept=".json,application/json" id="rf"><div id="rprev" class="mt"></div>`, (b, ov) => {
    b.querySelector('#rf').onchange = async e => {
      const f = e.target.files[0]; if (!f) return; let txt = await readFile(f); let data;
      try { data = JSON.parse(txt); } catch (er) { b.querySelector('#rprev').innerHTML = '<div class="banner err">This file is not a valid backup (could not be read).</div>'; return; }
      if (data.encrypted) {
        if (!hasCrypto()) { b.querySelector('#rprev').innerHTML = '<div class="banner err">Encrypted backups need https or a local file in a modern browser.</div>'; return; }
        b.querySelector('#rprev').innerHTML = `<form>${F.text('pw', 'Backup password', '', 'type="password"')}<button class="btn block">Unlock</button></form>`;
        b.querySelector('#rprev form').onsubmit = async ev => { ev.preventDefault(); try { data = JSON.parse(await decryptText(data, formData(ev.target).pw)); showPrev(data); } catch (er) { toast('Wrong password or damaged file'); } };
        return;
      }
      showPrev(data);
    };
    function showPrev(data) {
      const errs = validateBackup(data); const el = b.querySelector('#rprev');
      if (errs.length) { el.innerHTML = `<div class="banner err">Cannot restore: ${errs.map(esc).join('; ')}</div>`; return; }
      const fc = data.files ? Object.keys(data.files).length : 0;
      el.innerHTML = `<div class="banner ok" style="display:block">✅ Backup looks good.<br>Exported: ${data.exportedAt ? new Date(data.exportedAt).toLocaleString('en-SG', { timeZone: TZ }) : 'unknown'}<br>${data.txns.length} transactions · ${data.accounts.length} accounts · ${(data.bills || []).length} planned payments · ${(data.debts || []).length} debts · ${(data.goals || []).length} goals${fc ? ` · ${fc} receipts` : ''}</div><div class="banner warn">Restoring <b>replaces</b> everything currently in the app on this device (${S.txns.length} transactions). A safety copy of your current data is kept.</div><button class="btn block" data-go>Replace with this backup</button>`;
      el.querySelector('[data-go]').onclick = async () => {
        await snapshot('Before restoring a backup');
        const files = data.files; delete data.files; ['exportedAt', 'app'].forEach(k => delete data[k]);
        S = migrate(data); invalidate(); await save(true);
        if (files) for (const [k, v] of Object.entries(files)) { try { await DB.set(k, v, 'files'); } catch (e) { } }
        U.view = S.settings.defaultView || 'all'; applyTheme(); closeAllSheets(); U.tab = 'home'; render(); toast('Backup restored ✓');
      };
    }
  });
};
A.restoreSnapshot = async () => {
  const sn = await DB.get('snapshot').catch(() => null); if (!sn) return toast('No safety copy yet');
  if (!(await confirmBox('Restore safety copy', `Go back to the copy taken “${esc(sn.label)}” on ${new Date(sn.at).toLocaleString('en-SG', { timeZone: TZ })}? Changes made after that will be lost (your current data becomes the new safety copy).`, 'Restore', true))) return;
  const cur = S; S = migrate(sn.data); await DB.set('snapshot', { at: new Date().toISOString(), label: 'Before restoring safety copy', data: cur }); invalidate(); await save(true); applyTheme(); U.tab = 'home'; render(); toast('Safety copy restored');
};
A.exportAllCSV = () => { const r = U.ins.range; U.ins.range = 'custom'; const f = U.ins.from, t = U.ins.to, v = U.view; U.ins.from = '1900-01-01'; U.ins.to = '2999-12-31'; U.view = 'all'; A.exportCSV(); U.ins.range = r; U.ins.from = f; U.ins.to = t; U.view = v; };
A.removeSample = async () => { if (!(await confirmBox('Remove sample data', 'Remove all fictional sample records? Anything you entered yourself is kept.', 'Remove', true))) return; await snapshot('Before removing sample data'); const kept = removeSample(); commit(kept ? `Sample data removed (${kept} sample item(s) kept because your own records use them)` : 'Sample data removed'); };
A.eraseAll = async () => {

  openSheet('Type ERASE to confirm', `<form>${F.text('c', 'Type ERASE', '', 'autocomplete="off"')}<button class="btn danger block">Erase all data</button></form>`, (b, ov) => {
    b.querySelector('form').onsubmit = async e => { e.preventDefault(); if (formData(e.target).c.trim() !== 'ERASE') return toast('Type ERASE in capitals'); await snapshot('Before erasing all data'); try { for (const k of await DB.keys('files')) await DB.del(k, 'files'); } catch (er) { } S = defaultState(); await save(true); closeAllSheets(); U.tab = 'home'; applyTheme(); render(); toast('All data erased (one safety copy kept)'); };

/* ---------- IMPORT ---------- */
A.openImport = () => { closeAllSheets(); importSheet(S.inbox.length ? 'inbox' : 'paste'); };
A.openInbox = () => { closeAllSheets(); importSheet('inbox'); };
function handleHashImport() {
  const m = location.hash.match(/^#(?:add|import)=(.*)$/s); if (!m) return;
  let text = ''; try { text = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { text = m[1]; }
  history.replaceState(null, '', location.pathname + location.search);
  if (!text.trim()) return;
  S.inbox.push({ id: uid(), text: text.slice(0, 2000), at: new Date().toISOString() }); save();
  toast('Notification received — review it before saving'); importSheet('inbox');
}

      const f = e.target.files[0]; if (!f) return; const txt = await readFile(f); const all = parseCSV(txt); if (!all.length) return toast('That file has no rows');
      let hr = all.findIndex(r => r.some(c => /date/i.test(c)) && r.some(c => /desc|detail|particular|reference|merchant|transaction/i.test(c))); if (hr < 0) hr = 0;
      const hdr = all[hr].map(c => String(c).toLowerCase()); const find = re => { const i = hdr.findIndex(c => re.test(c)); return i < 0 ? '' : i; };
      const sample = (all[hr + 1] || [])[find(/date/)] || ''; const dfmt = /^\d{4}-/.test(sample) ? 'ymd' : /[a-z]{3}/i.test(sample) ? 'text' : 'dmy';
      csv = { rows: all, headerRow: hr, map: { date: find(/date/), desc: (() => { const dc = find(/date/); let i = hdr.findIndex((c, j) => j !== dc && /desc|detail|particular|merchant|payee/.test(c)); if (i < 0) i = hdr.findIndex((c, j) => j !== dc && /reference|transaction|narrative|remark/.test(c)); return i < 0 ? '' : i; })(), amount: find(/^amount|amount \(|amt/), debit: find(/debit|withdraw|money out|dr\b/), credit: find(/credit|deposit|money in|cr\b/), dfmt, flip: false, accountId: S.settings.defaultAccount, scope: 'personal' } };
      draw(b);
    };
    const mf = b.querySelector('#mapf'); if (mf) {
      mf.addEventListener('change', e => { if (e.target.name === 'headerRow') { csv.headerRow = Math.max(0, Math.round(num(e.target.value)) - 1); draw(b); } });
      mf.onsubmit = e => {
        e.preventDefault(); const v = formData(mf); Object.assign(csv.map, v); const m = csv.map;
        if (m.date === '' || m.desc === '' || (m.amount === '' && m.debit === '' && m.credit === '')) return toast('Choose the date, description and amount columns');
        if (!m.accountId) return toast('Choose which account these belong to');
        const pd = s => { s = String(s || '').trim(); if (m.dfmt === 'ymd') { const x = s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/); return x ? `${x[1]}-${x[2].padStart(2, '0')}-${x[3].padStart(2, '0')}` : null; } if (m.dfmt === 'mdy') { const x = s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); return x ? parseDMY(`${x[2]}/${x[1]}/${x[3]}`) : null; } if (m.dfmt === 'text') { const d = parseDateLoose(s, 'X'); return d === 'X' ? null : d; } return parseDMY(s.split(' ')[0]); };
        const pa = s => { s = String(s ?? '').trim(); if (!s) return null; const neg = /^\(.*\)$/.test(s) || /-/.test(s) || /\bdr\b/i.test(s); const n = num(s.replace(/[()]/g, '').replace(/,/g, '').replace(/cr|dr/ig, '')); if (!n && n !== 0) return null; return neg ? -Math.abs(n) : Math.abs(n); };
        rows = []; let bad = 0;
        for (const r of csv.rows.slice(csv.headerRow + 1)) {
          const date = pd(r[m.date]); let amt = null;
          if (m.amount !== '') { amt = pa(r[m.amount]); if (amt != null && v.flip) amt = -amt; }
          else { const dbt = pa(r[m.debit]), cdt = pa(r[m.credit]); if (dbt) amt = -Math.abs(dbt); else if (cdt) amt = Math.abs(cdt); }
          if (!date || amt == null || amt === 0) { bad++; continue; }
          const desc = String(r[m.desc] || '').replace(/\s+/g, ' ').trim(); const type = amt < 0 ? 'expense' : (/refund|reversal/i.test(desc) ? 'refund' : 'income');
          const sug = suggestCategory(desc, type) || {};
          rows.push(checkDup({ type, amount: r2(Math.abs(amt)), date, time: '12:00', desc, accountId: m.accountId, catId: sug.catId || '', subId: sug.subId || '', scope: m.scope }));
        }
        if (bad) toast(`${bad} row(s) skipped (no valid date or amount)`); draw(b);
      };
    }
    b.querySelectorAll('[data-row]').forEach(card => { const i = +card.dataset.row; card.addEventListener('change', e => { const f = e.target.dataset.f; if (!f) return; const r = rows[i]; r[f] = e.target.type === 'checkbox' ? e.target.checked : f === 'amount' ? r2(num(e.target.value)) : e.target.value; if (f === 'type' || f === 'desc') { if (f === 'desc' || !r.catId) { const s = suggestCategory(r.desc, r.type); if (s) { r.catId = s.catId; r.subId = s.subId || ''; } } if (f === 'type') r.catId = ''; draw(b); } }); });
    const cm = b.querySelector('[data-commit]'); if (cm) cm.onclick = async () => {
      const sel = rows.filter(r => r.sel); if (!sel.length) return toast('Nothing selected');
      for (const r of sel) { if (!(r.amount > 0) || !r.date || !r.accountId) return toast('Each selected row needs an amount, date and account'); if (r.type === 'transfer' && (!r.toAccountId || r.toAccountId === r.accountId)) return toast('Transfers need a different “to” account'); }
      for (const r of sel) {
        const t = { id: uid(), type: r.type, amount: r.amount, date: r.date, time: r.time || '12:00', desc: r.desc, catId: r.type === 'transfer' ? '' : r.catId || (r.type === 'income' ? 'otherin' : 'misc'), subId: r.subId || '', accountId: r.accountId, toAccountId: r.toAccountId || '', method: 'Imported', scope: r.scope || 'personal', notes: '', createdAt: new Date().toISOString() };
        if (t.scope === 'household') { t.paidBy = 'me'; t.myShare = S.settings.myShare; }
        if (t.scope === 'business') t.bizId = (S.businesses[0] || {}).id;
        t.importKey = importKey(t); S.txns.push(t); learnMerchant(t);
      }
      const used = new Set(rows.map(r => r.inboxId).filter(Boolean)); if (used.size) S.inbox = S.inbox.filter(x => !used.has(x.id));
      closeSheet(ov); commit(`${sel.length} transaction(s) imported`);
    };
  }
}
